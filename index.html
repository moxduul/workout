<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Workout Timer v1.3</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070A0F;
      --card: rgba(255,255,255,0.06);
      --card2: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.10);
      --muted: rgba(255,255,255,0.65);
      --text: rgba(255,255,255,0.92);
      --accent: #60A5FA;
      --danger: #EF4444;
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
      --radius: 18px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(1200px 700px at 50% -10%, rgba(96,165,250,0.18), transparent 60%),
                  radial-gradient(900px 600px at 10% 20%, rgba(34,197,94,0.10), transparent 55%),
                  radial-gradient(900px 600px at 90% 30%, rgba(239,68,68,0.08), transparent 55%),
                  var(--bg);
      color: var(--text);
      padding: 14px;
      padding-bottom: calc(14px + env(safe-area-inset-bottom));
    }

    .app { max-width: 980px; margin: 0 auto; display: grid; gap: 14px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 14px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

    textarea {
      width: 100%;
      min-height: 240px;
      resize: vertical;
      background: rgba(0,0,0,0.35);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      padding: 12px;
      outline: none;
      line-height: 1.35;
      font-size: 14px;
    }

    .row { display:flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    .row.left { justify-content: flex-start; }

    .pill {
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.10);
      color: rgba(255,255,255,0.86);
      font-size: 13px;
      user-select: none;
    }

    button {
      background: rgba(96,165,250,0.22);
      color: rgba(255,255,255,0.92);
      border: 1px solid rgba(96,165,250,0.38);
      padding: 10px 12px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 750;
      font-size: 14px;
      transition: transform 0.06s ease, background 0.15s ease, border-color 0.15s ease;
    }
    button:active { transform: translateY(1px); }
    button.secondary {
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,255,255,0.14);
    }
    button.danger {
      background: rgba(239,68,68,0.18);
      border-color: rgba(239,68,68,0.35);
    }
    button:disabled { opacity: .45; cursor: not-allowed; }

    input[type="checkbox"] { transform: translateY(1px) scale(1.05); }

    /* Right panel (workout display) */
    .desc {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.2px;
      line-height: 1.28;
      margin-top: 4px;
    }

    .bigRow {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }
    @media (max-width: 520px) { .bigRow { grid-template-columns: 1fr; } }

    .bigBox {
      background: var(--card2);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 18px;
      padding: 12px 12px 10px;
    }

    .bigLabel {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .bigTime {
      font-variant-numeric: tabular-nums;
      font-size: 56px;
      font-weight: 950;
      letter-spacing: -1px;
      line-height: 1;
    }

    .meta {
      margin-top: 12px;
      color: rgba(255,255,255,0.82);
      font-size: 13px;
      display:flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .progressWrap { margin-top: 12px; }
    .bar {
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.10);
    }
    .fill { height: 100%; width: 0%; background: rgba(96,165,250,0.85); }

    /* Controls */
    .controlsBig {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .controlsBig button {
      padding: 14px 14px;
      font-size: 18px;
      border-radius: 18px;
      background: rgba(96,165,250,0.26);
      border-color: rgba(96,165,250,0.42);
    }

    .controlsSmall {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .controlsSmall button {
      padding: 12px 12px;
      font-size: 16px;
      border-radius: 18px;
    }

    .toggles {
      display:flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
      align-items: center;
      color: rgba(255,255,255,0.84);
      font-size: 13px;
    }

    /* Interval list (editor mode only) */
    .list {
      max-height: 260px;
      overflow: auto;
      border-top: 1px solid rgba(255,255,255,0.10);
      margin-top: 12px;
      padding-top: 12px;
    }
    .seg {
      display: grid;
      grid-template-columns: 74px 1fr;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 14px;
      border: 1px solid transparent;
      background: rgba(0,0,0,0.18);
    }
    .seg + .seg { margin-top: 8px; }
    .seg.active { border-color: rgba(96,165,250,0.60); background: rgba(96,165,250,0.12); }
    .seg .t { font-variant-numeric: tabular-nums; opacity: .88; }
    .seg .d { opacity: .96; }

    /* HR zone bar */
    .zoneWrap {
      margin-top: 12px;
      background: rgba(0,0,0,0.26);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 16px;
      padding: 10px;
    }
    .zoneHeader {
      display:flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
      margin-bottom: 8px;
      color: rgba(255,255,255,0.80);
      font-size: 13px;
    }
    .zoneHeader .zname { font-weight: 850; letter-spacing: -0.2px; }
    .zoneHeader .zrange { font-variant-numeric: tabular-nums; opacity: .80; }

    .zoneBar {
      position: relative;
      height: 14px;
      border-radius: 999px;
      overflow: hidden;
      display: flex;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
    }
    .zseg { height: 100%; }
    /* zone colors */
    .z1 { background: #8B949E; }      /* grey */
    .z2 { background: #7DD3FC; }      /* light blue */
    .z3 { background: #22C55E; }      /* green */
    .z4 { background: #F59E0B; }      /* yellow-orange */
    .z5 { background: #EF4444; }      /* red */

    .zoneMarker {
      position: absolute;
      top: -6px;
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 8px solid rgba(255,255,255,0.92);
      transform: translateX(-6px);
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.45));
      opacity: 0;
    }
    .zoneMarkerLine {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(255,255,255,0.88);
      transform: translateX(-1px);
      opacity: 0;
    }
    .zoneTicks {
      display:flex;
      justify-content: space-between;
      margin-top: 6px;
      color: rgba(255,255,255,0.55);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    /* Workout mode: show only what matters */
    .workoutMode .editorCard { display: none; }
    .workoutMode .grid { grid-template-columns: 1fr; }
    .workoutMode .list { display: none; }
    .workoutMode .desc { font-size: clamp(19px, 3.6vw, 28px); font-weight: 900; }
    .workoutMode .bigTime { font-size: clamp(72px, 12vw, 118px); }
    .workoutMode .bigLabel { display: none; } /* no labels in workout mode */
    .workoutMode .bigBox { padding: 12px; }
    .workoutMode .toggles { display: none; } /* keep it ultra-clean in workout mode */

    /* Tiny top strip (no title) */
    .topStrip { display:flex; justify-content: space-between; gap: 10px; align-items:center; }
    .topStrip .left { display:flex; gap: 10px; align-items:center; }
  </style>
</head>

<body>
  <div class="app">
    <div class="topStrip">
      <div class="left">
        <span class="pill">
          <input type="checkbox" id="modeToggle" />
          Workout mode
        </span>
      </div>
      <div class="left">
        <button id="hrConnectBtn" class="secondary">HR Connect</button>
        <button id="hrDisconnectBtn" class="danger" disabled>HR Off</button>
      </div>
    </div>

    <div class="grid">
      <div class="card editorCard">
        <div class="row">
          <div class="pill" style="opacity:.9;">Paste workout text (intervals must start with a duration, e.g. <span style="font-family:var(--mono);">9m20s</span>)</div>
          <div class="row left">
            <button id="loadBtn">Load</button>
            <button id="clearBtn" class="danger">Clear</button>
          </div>
        </div>
        <div style="margin-top:10px;">
          <textarea id="input" placeholder="Paste your workout here..."></textarea>
        </div>
      </div>

      <div class="card">
        <div id="segmentDesc" class="desc">Load a workout to begin.</div>

        <div class="bigRow">
          <div class="bigBox">
            <div class="bigLabel">Remaining</div>
            <div id="countdown" class="bigTime">00:00</div>
          </div>
          <div class="bigBox">
            <div class="bigLabel">BPM</div>
            <div id="hrBpm" class="bigTime">—</div>
          </div>
        </div>

        <div class="zoneWrap">
          <div class="zoneHeader">
            <div class="zname" id="zoneName">—</div>
            <div class="zrange" id="zoneRange">0–175 bpm</div>
          </div>
          <div class="zoneBar" id="zoneBar">
            <!-- widths are set by JS for exact proportions -->
            <div class="zseg z1" id="z1"></div>
            <div class="zseg z2" id="z2"></div>
            <div class="zseg z3" id="z3"></div>
            <div class="zseg z4" id="z4"></div>
            <div class="zseg z5" id="z5"></div>

            <div class="zoneMarker" id="zoneMarker"></div>
            <div class="zoneMarkerLine" id="zoneMarkerLine"></div>
          </div>
          <div class="zoneTicks">
            <span>0</span><span>106</span><span>123</span><span>141</span><span>158</span><span>175</span>
          </div>
        </div>

        <div class="meta">
          <div id="metaLeft">Segment —/—</div>
          <div id="metaRight">Total —</div>
        </div>

        <div class="progressWrap">
          <div class="bar"><div id="fill" class="fill"></div></div>
          <div class="meta" style="margin-top:10px;">
            <div id="posInfo">Elapsed — • Remaining —</div>
            <div id="hrStatus" style="color:rgba(255,255,255,0.55);">HR: not connected</div>
          </div>
        </div>

        <div class="controlsBig">
          <button id="playBtn" disabled>Play</button>
          <button id="nextBtn" class="secondary" disabled>Next</button>
        </div>

        <div class="controlsSmall">
          <button id="prevBtn" class="secondary" disabled>Prev</button>
          <button id="resetBtn" class="danger" disabled>Reset</button>
          <button id="reloadBtn" class="secondary" disabled>Reload</button>
        </div>

        <div class="toggles">
          <label class="pill"><input type="checkbox" id="beepToggle" checked /> Beep</label>
          <label class="pill"><input type="checkbox" id="countdownBeepToggle" /> 3-2-1</label>
          <label class="pill"><input type="checkbox" id="vibrateToggle" checked /> Vibrate</label>
          <label class="pill"><input type="checkbox" id="wakeLockToggle" /> Keep awake</label>
        </div>

        <div class="list" id="segmentsList"></div>
      </div>
    </div>
  </div>

<script>
(() => {
  /** -------------------- Storage -------------------- **/
  const STORAGE_KEY = "workout_timer_v1_3";
  function saveState(partial) {
    const current = loadState();
    const merged = { ...current, ...partial };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch {
      return {};
    }
  }

  /** -------------------- Helpers -------------------- **/
  function withTimeout(promise, ms, msg) {
    let t;
    const timeout = new Promise((_, reject) => { t = setTimeout(() => reject(new Error(msg)), ms); });
    return Promise.race([promise, timeout]).finally(() => clearTimeout(t));
  }

  function formatMMSS(ms) {
    const clamped = Math.max(0, Math.ceil(ms / 1000));
    const mm = Math.floor(clamped / 60);
    const ss = clamped % 60;
    return String(mm).padStart(2, "0") + ":" + String(ss).padStart(2, "0");
  }

  function escapeHtml(str) {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  /** -------------------- Parsing -------------------- **/
  function parseDurationMs(candidate) {
    const t = candidate.trim().toLowerCase();
    let hours = 0, mins = 0, secs = 0;

    const h = t.match(/(\d+)\s*h/);
    const m = t.match(/(\d+)\s*m/);
    const s = t.match(/(\d+)\s*s/);
    if (h) hours = parseInt(h[1], 10);
    if (m) mins = parseInt(m[1], 10);
    if (s) secs = parseInt(s[1], 10);

    const ms = ((hours * 3600) + (mins * 60) + secs) * 1000;
    return ms > 0 ? ms : null;
  }

  function extractLeadingDuration(line) {
    const trimmed = line.trim();
    if (!trimmed) return null;

    const parts = trimmed.split(/\s+/);
    let best = null;
    for (let k = 1; k <= Math.min(4, parts.length); k++) {
      const candidate = parts.slice(0, k).join(" ");
      const ms = parseDurationMs(candidate);
      if (ms != null) best = { ms, usedTokens: k };
    }
    if (!best) return null;

    return {
      ms: best.ms,
      rest: parts.slice(best.usedTokens).join(" ").trim(),
      usedTokens: best.usedTokens,
    };
  }

  function isRepeatHeader(line) {
    const m = line.trim().match(/^(.*)\b(\d+)\s*x\s*$/i);
    if (!m) return null;
    const label = (m[1] || "").trim() || "Repeat";
    const count = parseInt(m[2], 10);
    if (!Number.isFinite(count) || count <= 1) return null;
    return { label, count };
  }

  function isNonIntervalHeader(line) {
    const t = line.trim();
    if (!t) return false;
    return extractLeadingDuration(t) === null;
  }

  function parseWorkout(text) {
    const lines = text
      .split(/\r?\n/)
      .map(l => l.trim())
      .filter(l => l.length > 0);

    const out = [];
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];

      const rep = isRepeatHeader(line);
      if (rep) {
        const block = [];
        i++;
        while (i < lines.length) {
          const candidateLine = lines[i];
          const dur = extractLeadingDuration(candidateLine);
          if (!dur) break;
          block.push({
            durationMs: dur.ms,
            displayText: candidateLine.trim(),
            rest: dur.rest,
            section: rep.label,
          });
          i++;
        }

        for (let r = 1; r <= rep.count; r++) {
          for (const seg of block) {
            out.push({
              durationMs: seg.durationMs,
              displayText: seg.displayText,
              rest: seg.rest,
              section: `${rep.label} (${r}/${rep.count})`
            });
          }
        }
        continue;
      }

      const dur = extractLeadingDuration(line);
      if (dur) {
        out.push({
          durationMs: dur.ms,
          displayText: line.trim(),
          rest: dur.rest,
          section: null
        });
        i++;
        continue;
      }

      const header = line.trim();
      i++;
      while (i < lines.length) {
        const next = lines[i];
        if (isRepeatHeader(next) || isNonIntervalHeader(next)) break;

        const d = extractLeadingDuration(next);
        if (!d) break;

        out.push({
          durationMs: d.ms,
          displayText: next.trim(),
          rest: d.rest,
          section: header
        });
        i++;
      }
    }

    if (out.length === 0) {
      throw new Error("No intervals found. Make sure lines start with durations like '9m20s ...'.");
    }
    return out;
  }

  /** -------------------- HR Zones -------------------- **/
  const HR_MIN = 0;
  const HR_MAX = 175;

  const ZONES = [
    { name: "Z1", min: 0,   max: 106 },
    { name: "Z2", min: 107, max: 123 },
    { name: "Z3", min: 124, max: 141 },
    { name: "Z4", min: 142, max: 158 },
    { name: "Z5", min: 159, max: 175 },
  ];

  function zoneForBpm(bpm) {
    if (bpm == null || !Number.isFinite(bpm)) return null;
    const b = Math.max(HR_MIN, Math.min(HR_MAX, bpm));
    return ZONES.find(z => b >= z.min && b <= z.max) || null;
  }

  function setZoneWidths() {
    const total = HR_MAX - HR_MIN;
    const widths = ZONES.map(z => (z.max - z.min + 1) / (total + 1) * 100);
    els.z1.style.width = widths[0] + "%";
    els.z2.style.width = widths[1] + "%";
    els.z3.style.width = widths[2] + "%";
    els.z4.style.width = widths[3] + "%";
    els.z5.style.width = widths[4] + "%";
  }

  function updateZoneUI(bpm) {
    const z = zoneForBpm(bpm);
    if (!z) {
      els.zoneName.textContent = "—";
      els.zoneRange.textContent = `${HR_MIN}–${HR_MAX} bpm`;
      els.zoneMarker.style.opacity = 0;
      els.zoneMarkerLine.style.opacity = 0;
      return;
    }

    els.zoneName.textContent = z.name;
    els.zoneRange.textContent = `${z.min}–${z.max} bpm`;

    const clamped = Math.max(HR_MIN, Math.min(HR_MAX, bpm));
    const pct = ((clamped - HR_MIN) / (HR_MAX - HR_MIN)) * 100;

    els.zoneMarker.style.left = pct + "%";
    els.zoneMarkerLine.style.left = pct + "%";
    els.zoneMarker.style.opacity = 1;
    els.zoneMarkerLine.style.opacity = 1;
  }

  /** -------------------- Heart Rate (Web Bluetooth) -------------------- **/
  const HR_SERVICE = "heart_rate";
  const HR_MEASUREMENT = "heart_rate_measurement"; // 0x2A37

  let hrState = {
    device: null,
    char: null,
    bpm: null,
    lastUpdate: null
  };

  function parseHR(dataView) {
    const flags = dataView.getUint8(0);
    const isUint16 = (flags & 0x01) === 0x01;

    let offset = 1;
    const bpm = isUint16 ? dataView.getUint16(offset, true) : dataView.getUint8(offset);
    return { bpm };
  }

  function setHrStatus(text) {
    els.hrStatus.textContent = text;
  }

  function updateHrUI() {
    els.hrBpm.textContent = hrState.bpm == null ? "—" : String(hrState.bpm);
    updateZoneUI(hrState.bpm);
  }

  async function connectHeartRate() {
    if (!navigator.bluetooth) {
      alert("Web Bluetooth not available in this browser.");
      return;
    }
    if (!window.isSecureContext) {
      alert("Web Bluetooth requires HTTPS. GitHub Pages should be fine—make sure the URL is https://");
      return;
    }

    try {
      setHrStatus("HR: requesting…");
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ services: [HR_SERVICE] }]
      });

      device.addEventListener("gattserverdisconnected", () => {
        hrState = { device: null, char: null, bpm: null, lastUpdate: null };
        setHrStatus("HR: disconnected");
        els.hrConnectBtn.disabled = false;
        els.hrDisconnectBtn.disabled = true;
        updateHrUI();
      });

      setHrStatus("HR: connecting…");
      const server = await withTimeout(device.gatt.connect(), 8000, "GATT connect timed out (Polar app might still be connected).");

      const service = await withTimeout(server.getPrimaryService(HR_SERVICE), 6000, "Could not get Heart Rate service.");
      const ch = await withTimeout(service.getCharacteristic(HR_MEASUREMENT), 6000, "Could not get HR measurement characteristic.");

      await ch.startNotifications();
      ch.addEventListener("characteristicvaluechanged", (event) => {
        const dv = event.target.value;
        const { bpm } = parseHR(dv);
        hrState.bpm = bpm;
        hrState.lastUpdate = new Date().toLocaleTimeString();
        setHrStatus("HR: on");
        updateHrUI();
      });

      hrState.device = device;
      hrState.char = ch;

      els.hrConnectBtn.disabled = true;
      els.hrDisconnectBtn.disabled = false;
      setHrStatus("HR: on");
      updateHrUI();
    } catch (e) {
      setHrStatus("HR: not connected");
      els.hrConnectBtn.disabled = false;
      els.hrDisconnectBtn.disabled = true;
      alert(e?.message || String(e));
    }
  }

  function disconnectHeartRate() {
    try {
      if (hrState?.device?.gatt?.connected) hrState.device.gatt.disconnect();
    } finally {
      hrState = { device: null, char: null, bpm: null, lastUpdate: null };
      setHrStatus("HR: off");
      els.hrConnectBtn.disabled = false;
      els.hrDisconnectBtn.disabled = true;
      updateHrUI();
    }
  }

  /** -------------------- Player -------------------- **/
  const els = {
    input: document.getElementById("input"),
    loadBtn: document.getElementById("loadBtn"),
    clearBtn: document.getElementById("clearBtn"),

    playBtn: document.getElementById("playBtn"),
    prevBtn: document.getElementById("prevBtn"),
    nextBtn: document.getElementById("nextBtn"),
    resetBtn: document.getElementById("resetBtn"),
    reloadBtn: document.getElementById("reloadBtn"),

    segmentDesc: document.getElementById("segmentDesc"),
    countdown: document.getElementById("countdown"),
    fill: document.getElementById("fill"),
    posInfo: document.getElementById("posInfo"),
    metaLeft: document.getElementById("metaLeft"),
    metaRight: document.getElementById("metaRight"),
    list: document.getElementById("segmentsList"),

    modeToggle: document.getElementById("modeToggle"),
    beepToggle: document.getElementById("beepToggle"),
    countdownBeepToggle: document.getElementById("countdownBeepToggle"),
    vibrateToggle: document.getElementById("vibrateToggle"),
    wakeLockToggle: document.getElementById("wakeLockToggle"),

    // HR
    hrStatus: document.getElementById("hrStatus"),
    hrBpm: document.getElementById("hrBpm"),
    hrConnectBtn: document.getElementById("hrConnectBtn"),
    hrDisconnectBtn: document.getElementById("hrDisconnectBtn"),

    // zones
    zoneName: document.getElementById("zoneName"),
    zoneRange: document.getElementById("zoneRange"),
    zoneMarker: document.getElementById("zoneMarker"),
    zoneMarkerLine: document.getElementById("zoneMarkerLine"),
    z1: document.getElementById("z1"),
    z2: document.getElementById("z2"),
    z3: document.getElementById("z3"),
    z4: document.getElementById("z4"),
    z5: document.getElementById("z5"),
  };

  const DEMO = `Warmup

9m20s 50-75% (75-112w) FTP
Main set 3x

15m 90% (135w) FTP
5m 55% (82w) FTP
Cooldown

9m20s 50% (75w) FTP`;

  let segments = [];
  let idx = 0;
  let running = false;

  let segRemainingMs = 0;
  let lastTick = 0;

  let totalMs = 0;
  let elapsedBeforeCurrentMs = 0;

  let lastSecondAnnounced = null;

  function sumTotalMs(segs) {
    return segs.reduce((a, s) => a + s.durationMs, 0);
  }
  function computeElapsedBeforeIndex(segs, index) {
    let s = 0;
    for (let i = 0; i < index; i++) s += segs[i].durationMs;
    return s;
  }

  function beep(freq = 880, ms = 110) {
    if (!els.beepToggle.checked) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      gain.gain.value = 0.05;
      osc.start();
      setTimeout(() => { osc.stop(); ctx.close(); }, ms);
    } catch (_) {}
  }

  function vibrate(pattern) {
    if (!els.vibrateToggle.checked) return;
    if (navigator.vibrate) {
      try { navigator.vibrate(pattern); } catch (_) {}
    }
  }

  // Wake Lock
  let wakeLock = null;
  async function setWakeLock(on) {
    if (!("wakeLock" in navigator)) {
      els.wakeLockToggle.checked = false;
      saveState({ wakeLock: false });
      return;
    }
    try {
      if (on) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      } else if (wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
    } catch (_) {
      els.wakeLockToggle.checked = false;
      saveState({ wakeLock: false });
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && els.wakeLockToggle.checked && running) {
      setWakeLock(true);
    }
  });

  function renderList() {
    els.list.innerHTML = "";
    segments.forEach((s, i) => {
      const div = document.createElement("div");
      div.className = "seg" + (i === idx ? " active" : "");
      div.innerHTML = `
        <div class="t">${formatMMSS(s.durationMs)}</div>
        <div class="d">${escapeHtml((s.section ? (s.section + " — ") : "") + s.displayText)}</div>
      `;
      div.addEventListener("click", () => jumpTo(i));
      els.list.appendChild(div);
    });
  }

  function setButtonsEnabled(enabled) {
    els.playBtn.disabled = !enabled;
    els.prevBtn.disabled = !enabled;
    els.nextBtn.disabled = !enabled;
    els.resetBtn.disabled = !enabled;
    els.reloadBtn.disabled = !enabled;
  }

  function setRunning(on) {
    running = on;
    els.playBtn.textContent = running ? "Pause" : "Play";
    if (running) {
      lastTick = performance.now();
      lastSecondAnnounced = null;
      if (els.wakeLockToggle.checked) setWakeLock(true);
      requestAnimationFrame(tick);
    } else {
      setWakeLock(false);
    }
  }

  function describeCurrent() {
    if (!segments.length) return "Load a workout to begin.";
    const s = segments[idx];
    return (s.section ? `${s.section} — ` : "") + s.displayText;
  }

  function updateUI() {
    if (!segments.length) {
      els.segmentDesc.textContent = "Load a workout to begin.";
      els.countdown.textContent = "00:00";
      els.fill.style.width = "0%";
      els.posInfo.textContent = "Elapsed — • Remaining —";
      els.metaLeft.textContent = "Segment —/—";
      els.metaRight.textContent = "Total —";
      els.list.innerHTML = "";
      return;
    }

    const s = segments[idx];
    els.segmentDesc.textContent = describeCurrent();
    els.countdown.textContent = formatMMSS(segRemainingMs);

    const elapsedTotal = elapsedBeforeCurrentMs + (s.durationMs - segRemainingMs);
    const pct = totalMs > 0 ? (elapsedTotal / totalMs) * 100 : 0;
    els.fill.style.width = `${Math.min(100, Math.max(0, pct)).toFixed(2)}%`;

    els.posInfo.textContent = `Elapsed ${formatMMSS(elapsedTotal)} • Remaining ${formatMMSS(totalMs - elapsedTotal)}`;
    els.metaLeft.textContent = `Segment ${idx + 1}/${segments.length}`;
    els.metaRight.textContent = `Total ${formatMMSS(totalMs)}`;

    renderList();
  }

  function loadWorkout(fromText) {
    const text = (fromText ?? els.input.value) || "";
    try {
      segments = parseWorkout(text);
      idx = 0;
      totalMs = sumTotalMs(segments);
      elapsedBeforeCurrentMs = 0;
      segRemainingMs = segments[0].durationMs;

      setButtonsEnabled(true);
      setRunning(false);
      updateUI();

      saveState({ workoutText: text });
    } catch (e) {
      alert(e.message || String(e));
    }
  }

  function jumpTo(newIdx) {
    if (!segments.length) return;
    idx = Math.max(0, Math.min(segments.length - 1, newIdx));
    elapsedBeforeCurrentMs = computeElapsedBeforeIndex(segments, idx);
    segRemainingMs = segments[idx].durationMs;
    setRunning(false);
    updateUI();
  }

  function nextSegment() {
    if (!segments.length) return;
    if (idx < segments.length - 1) {
      idx++;
      elapsedBeforeCurrentMs = computeElapsedBeforeIndex(segments, idx);
      segRemainingMs = segments[idx].durationMs;
      lastSecondAnnounced = null;
      beep();
      vibrate([60, 40, 60]);
      updateUI();
    } else {
      setRunning(false);
      segRemainingMs = 0;
      updateUI();
      beep(660, 180);
      vibrate([120, 60, 120]);
    }
  }

  function prevSegment() {
    if (!segments.length) return;
    if (idx > 0) {
      idx--;
      elapsedBeforeCurrentMs = computeElapsedBeforeIndex(segments, idx);
      segRemainingMs = segments[idx].durationMs;
      setRunning(false);
      updateUI();
    }
  }

  function resetWorkout() {
    if (!segments.length) return;
    idx = 0;
    elapsedBeforeCurrentMs = 0;
    segRemainingMs = segments[0].durationMs;
    setRunning(false);
    updateUI();
  }

  function tick(now) {
    if (!running) return;
    const dt = now - lastTick;
    lastTick = now;

    segRemainingMs -= dt;

    if (els.countdownBeepToggle.checked) {
      const sec = Math.max(0, Math.ceil(segRemainingMs / 1000));
      if (sec <= 3 && sec >= 1 && sec !== lastSecondAnnounced) {
        lastSecondAnnounced = sec;
        const freq = sec === 3 ? 520 : (sec === 2 ? 620 : 720);
        beep(freq, 90);
        vibrate(40);
      }
    }

    if (segRemainingMs <= 0) {
      const overshoot = -segRemainingMs;
      nextSegment();
      if (running && segments.length && idx < segments.length) {
        segRemainingMs = Math.max(0, segRemainingMs - overshoot);
      }
    }

    updateUI();
    if (running) requestAnimationFrame(tick);
  }

  /** -------------------- Mode -------------------- **/
  function setWorkoutMode(on) {
    document.body.classList.toggle("workoutMode", on);
    els.modeToggle.checked = on;
    saveState({ workoutMode: on });
  }

  /** -------------------- Wire up -------------------- **/
  els.loadBtn.addEventListener("click", () => loadWorkout());
  els.reloadBtn.addEventListener("click", () => loadWorkout());

  els.clearBtn.addEventListener("click", () => {
    els.input.value = "";
    saveState({ workoutText: "" });
  });

  els.playBtn.addEventListener("click", () => {
    if (!segments.length) return;
    setRunning(!running);
  });

  els.nextBtn.addEventListener("click", () => {
    setRunning(false);
    nextSegment();
  });

  els.prevBtn.addEventListener("click", () => prevSegment());
  els.resetBtn.addEventListener("click", () => resetWorkout());

  els.modeToggle.addEventListener("change", (e) => setWorkoutMode(e.target.checked));

  els.beepToggle.addEventListener("change", () => saveState({ beep: els.beepToggle.checked }));
  els.countdownBeepToggle.addEventListener("change", () => saveState({ countdownBeep: els.countdownBeepToggle.checked }));
  els.vibrateToggle.addEventListener("change", () => saveState({ vibrate: els.vibrateToggle.checked }));

  els.wakeLockToggle.addEventListener("change", async () => {
    saveState({ wakeLock: els.wakeLockToggle.checked });
    if (running) await setWakeLock(els.wakeLockToggle.checked);
  });

  // HR buttons
  els.hrConnectBtn.addEventListener("click", connectHeartRate);
  els.hrDisconnectBtn.addEventListener("click", disconnectHeartRate);

  // Autosave workout text as you type/paste
  let saveTimer = null;
  els.input.addEventListener("input", () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => saveState({ workoutText: els.input.value }), 250);
  });

  /** -------------------- Init -------------------- **/
  setZoneWidths();

  const stored = loadState();

  els.input.value = (typeof stored.workoutText === "string" && stored.workoutText.length)
    ? stored.workoutText
    : DEMO;

  els.beepToggle.checked = stored.beep !== false; // default true
  els.countdownBeepToggle.checked = stored.countdownBeep === true; // default false
  els.vibrateToggle.checked = stored.vibrate !== false; // default true
  els.wakeLockToggle.checked = stored.wakeLock === true; // default false

  setWorkoutMode(stored.workoutMode === true);

  setHrStatus("HR: not connected");
  updateHrUI();

  // Auto-load so user can just hit Play
  loadWorkout(els.input.value);
})();
</script>
</body>
</html>
